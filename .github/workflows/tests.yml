name: Five Bars - regression tests

on:
  pull_request:
    branches: [main]
  push:
    branches: ['feature/**']

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.mjs
      - run: node scripts/deals.mjs check
      - run: node --check scripts/auto-update.mjs
      - run: node --check scripts/price-evidence.mjs
      - run: node --check site/value-core.mjs
      - run: node --check site/value-ui.mjs
      - run: node scripts/review-offer.mjs audit
