name: Daily deal update

on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: five-bars
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download today's deal pages
        run: node scripts/deals.mjs prep

      - name: Claude updates the deal list (runs on your Claude subscription)
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Read scripts/UPDATE_INSTRUCTIONS.md and follow it exactly to update site/data/deals.json for today.
          claude_args: |
            --max-turns 60
            --allowedTools "Read,Edit,Write,Glob,Grep,WebSearch,WebFetch,Bash(node scripts/deals.mjs check)"

      - name: Validate and stamp
        run: node scripts/deals.mjs finish

      - name: Save changes
        run: |
          git config user.name "five-bars-bot"
          git config user.email "five-bars-bot@users.noreply.github.com"
          git add site/data
          git diff --cached --quiet || git commit -m "Deals update $(date -u +%F)"
          git push

  deploy:
    needs: update
    if: ${{ always() && needs.update.result != 'cancelled' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
