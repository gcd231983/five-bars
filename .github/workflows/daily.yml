name: Five Bars - no-AI deal checks and website

on:
  schedule:
    - cron: '17 10 * * *' # 10:17 UTC; Eastern time varies with daylight saving
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: five-bars
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run deterministic regression tests
        run: node --test tests/*.test.mjs
      - name: Check updater syntax
        run: node --check scripts/auto-update.mjs
      - name: Check price evidence engine syntax
        run: node --check scripts/price-evidence.mjs
      - name: Check MVNO evidence engine syntax
        run: node --check scripts/mvno-evidence.mjs
      - name: Check current data structure
        run: node scripts/deals.mjs check
      - name: Scan public sources and expire known offers (no AI)
        run: node scripts/auto-update.mjs
      - name: Validate updated data
        run: node scripts/deals.mjs check
      - name: Commit safe changes and source status
        run: |
          git config user.name 'five-bars-bot'
          git config user.email 'five-bars-bot@users.noreply.github.com'
          git add site/data/deals.json site/data/changes.json site/data/status.json site/data/price-evidence.json site/data/price-history.json site/data/mvno-evidence.json site/data/mvno-history.json
          if ! git diff --cached --quiet; then
            git commit -m "Source check $(date -u +%F) (no AI)"
            git push
          fi

  deploy:
    needs: update
    if: ${{ needs.update.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
