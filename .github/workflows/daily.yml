name: Five Bars - no-AI deal checks and website

on:
  schedule:
    - cron: '17 10 * * *' # 10:17 UTC; Eastern time varies with daylight saving
  workflow_dispatch:
  # Ledger commits made with GITHUB_TOKEN do not trigger push workflows.
  # Publish completed human sign-offs and invalidations from trusted main.
  workflow_run:
    workflows: ['Five Bars - human offer terms sign-off']
    types: [completed]
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: five-bars
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      validated_sha: ${{ steps.snapshot.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run deterministic regression tests
        run: node --test tests/*.test.mjs
      - name: Check updater syntax
        run: node --check scripts/auto-update.mjs
      - name: Check price evidence engine syntax
        run: node --check scripts/price-evidence.mjs
      - name: Check MVNO evidence engine syntax
        run: node --check scripts/mvno-evidence.mjs
      - name: Check review queue engine syntax
        run: node --check scripts/review-queue.mjs
      - name: Check price alert engine syntax
        run: node --check scripts/alert-engine.mjs
      - name: Check GitHub Issues notification syntax
        run: node --check scripts/issue-alerts.mjs
      - name: Check current data structure
        run: node scripts/deals.mjs check
      - name: Scan public sources and expire known offers (no AI)
        run: node scripts/auto-update.mjs
      - name: Validate updated data
        run: node scripts/deals.mjs check
      - name: Regenerate source research and audit coverage
        run: node scripts/build-source-research.mjs
      - name: Regenerate evidence-based launch-readiness report
        run: node scripts/launch-readiness.mjs
      - name: Regenerate source-linked carrier comparison pages and SEO sitemap
        run: node scripts/build-comparisons.mjs
      - name: Validate the generated release before committing
        run: |
          node --test tests/*.test.mjs
          node scripts/deals.mjs check
          node scripts/review-offer.mjs audit
      - name: Commit safe changes and source status
        run: |
          git config user.name 'five-bars-bot'
          git config user.email 'five-bars-bot@users.noreply.github.com'
          git add site/data/deals.json site/data/changes.json site/data/status.json site/data/price-evidence.json site/data/price-history.json site/data/mvno-evidence.json site/data/mvno-history.json site/data/review-queue.json site/data/alerts.json site/compare/ site/carrier-comparisons.html site/sitemap.xml site/source-research.html site/data/research-audit.json site/launch-readiness.html site/data/launch-readiness.json
          if ! git diff --cached --quiet; then
            git commit -m "Source check $(date -u +%F) (no AI)"
            git push
          fi
      - name: Record the exact validated release
        id: snapshot
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Open deduplicated GitHub Issues for actionable price alerts
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: node scripts/notify-issues.mjs

  browser:
    needs: update
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.update.outputs.validated_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - name: Build versioned static release
        run: node scripts/build-release.mjs
      - run: node tests/browser-smoke.mjs
        env:
          FIVE_BARS_SITE_DIR: _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: five-bars-release-browser-screenshots
          path: browser-artifacts/
          if-no-files-found: ignore

  deploy:
    needs: [update, browser]
    if: ${{ needs.update.result == 'success' && needs.browser.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
