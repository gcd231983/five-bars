name: Five Bars - browser smoke checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runner
        run: npm install --no-save playwright@1.56.1
      - name: Generate official-source evidence audit
        run: node scripts/build-source-research.mjs
      - name: Generate launch-readiness dashboard
        run: node scripts/launch-readiness.mjs
      - name: Generate source-linked comparison pages
        run: node scripts/build-comparisons.mjs
      - name: Build versioned static release
        run: node scripts/build-release.mjs
      - name: Run mobile and desktop browser acceptance tests
        env:
          FIVE_BARS_SITE_DIR: _site
        run: node tests/browser-smoke.mjs
      - name: Run adversarial browser stress tests
        env:
          FIVE_BARS_SITE_DIR: _site
        run: node tests/adversarial-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: five-bars-browser-screenshots
          path: browser-artifacts/
          if-no-files-found: ignore
